name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android SDK packages
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          manager = shutil.which('sdkmanager') or str(pathlib.Path(os.environ['ANDROID_HOME']) / 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([manager, 'platforms;android-37.0', 'build-tools;36.0.0'], input='y\n' * 100, text=True, check=True)
          PY
      - name: Build, test, lint and package instrumentation
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Check packaged privacy and models
        shell: pwsh
        run: ./tools/verify-apk.ps1 -Apk app/build/outputs/apk/debug/app-debug.apk -Aapt2 "$env:ANDROID_HOME/build-tools/36.0.0/aapt2"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartGallery-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
